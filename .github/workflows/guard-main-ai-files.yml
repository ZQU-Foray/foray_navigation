name: Guard AI Workflow Files on main

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check protected AI workflow files
        shell: bash
        run: |
          set -euo pipefail
          PROTECTED='^(AGENTS\.md|plan\.md|tree\.md|decision\.md)$|^(docs/knowledge/|scripts/)'
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            CHANGED=$(git diff --name-only "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}")
          else
            CHANGED=$(git diff-tree --no-commit-id --name-only -r HEAD)
          fi
          BAD=$(printf '%s\n' "$CHANGED" | grep -E "$PROTECTED" || true)
          if [[ -n "$BAD" ]]; then
            echo "::error::AI 工作流文件不允许进入 main 分支："
            printf '%s\n' "$BAD"
            echo "受保护文件：AGENTS.md / plan.md / tree.md / decision.md / docs/knowledge/ / scripts/"
            echo "这些文件仅属于 dev 分支。如确有需要，请先在 decision.md 记录决策。"
            exit 1
          fi
          echo "检查通过：无 AI 工作流文件进入 main"
